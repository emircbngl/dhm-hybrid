[pytest]
# Run from repo root; only look inside tests/ (legacy test_*.py at root are out of scope).
testpaths = tests
# Make `from core.x import y` work without explicit PYTHONPATH.
pythonpath = src

filterwarnings =
    default
    error::DeprecationWarning:core.*
    error::DeprecationWarning:gui.*

markers =
    slow: tests that take >1s (e.g. bench_af, full pipeline)
    needs_gui: tests that require a QApplication

addopts = -ra
