# DHM Reconstruction — CI matrix
#
# v2.1.0: pin Linux + macOS test runs. Windows added in v2.1.x when
# the camera backend work lands (Pylon/IDS/Thorlabs SDKs are
# Windows-first). Torch tests run on Linux only — macOS + arm
# torch is fine but the venv on the dev box doesn't have it,
# the CI image will.
#
# Trigger: push to main + every PR. Heavy benchmark runs are gated
# behind a workflow_dispatch button so PR builds stay fast.

name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_bench:
        description: "Also run autofocus benchmark"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # PySide6 links against system EGL/GL/xkb even under the offscreen
      # platform plugin; without these, importing any Qt module on the
      # Linux runner dies with "libEGL.so.1: cannot open shared object file".
      - name: Install Qt runtime libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-xinerama0 libxcb-xkb1
      - name: Install scientific deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install torch (Linux only)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Torch tests are a Linux-only concern here, as the header says. The
      # hosted macOS runners are VMs whose Metal stack advertises MPS via
      # torch.backends.mps.is_available() but fails every allocation
      # ("MPS backend out of memory" for a 1 KiB tensor). requirements.txt
      # pulls torch in transitively, so drop it again on macOS and let the
      # torch-gated tests skip exactly as they do on a dev box without it.
      - name: Drop torch on macOS runners (no usable Metal)
        if: runner.os == 'macOS'
        run: pip uninstall -y torch || true
      - name: Headless test suite
        run: |
          export DHM_USER=ci
          PYTHONPATH=src:tests python -m pytest tests/ -q --tb=short \
              -m "not needs_gui"
      - name: Bug regression
        run: |
          python scripts/check_bugs.py --no-color

  bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_bench }}
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt torch
      - name: Run autofocus benchmark
        run: |
          PYTHONPATH=src:tests \
              python scripts/bench_autofocus.py \
                  --backends default,torch \
                  --shapes 256,512,1024
      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: tasks/bench_autofocus.json
