# DHM Reconstruction — CI matrix
#
# v2.0.0: pin Linux + macOS test runs. Windows will be added in a later
# 2.1.x release when
# the camera backend work lands (Pylon/IDS/Thorlabs SDKs are
# Windows-first). Torch tests run on Linux only — macOS + arm
# torch is fine but the venv on the dev box doesn't have it,
# the CI image will.
#
# Trigger: push to main + every PR. Heavy benchmark runs are gated
# behind a workflow_dispatch button so PR builds stay fast.

name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_bench:
        description: "Also run autofocus benchmark"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was retired on 2026-11-02 and now fails in 1 s with
        # "configuration ... is not supported". macos-15 is one of the two
        # macOS generations GitHub keeps; bump again when it is retired.
        # TEMPORARY DIAGNOSTIC MATRIX — do not merge.
        include:
          - {os: ubuntu-22.04, python: "3.13", variant: control}
          - {os: ubuntu-22.04, python: "3.13", variant: pyside610}
          - {os: ubuntu-22.04, python: "3.13", variant: pyside610-b}
          - {os: ubuntu-22.04, python: "3.13", variant: notorch}
          - {os: ubuntu-22.04, python: "3.13", variant: notorch-b}
          - {os: ubuntu-22.04, python: "3.13", variant: fileonly}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # PySide6 links against system EGL/GL/xkb even under the offscreen
      # platform plugin; without these, importing any Qt module on the
      # Linux runner dies with "libEGL.so.1: cannot open shared object file".
      - name: Install Qt runtime libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-xinerama0 libxcb-xkb1
      - name: Install scientific deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install torch (Linux only)
        if: runner.os == 'Linux' && !startsWith(matrix.variant, 'notorch')
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: DIAG pin PySide6 to the last locally-green version
        if: startsWith(matrix.variant, 'pyside610')
        run: pip install "PySide6==6.10.2"
      - name: DIAG drop torch pulled in by requirements.txt
        if: startsWith(matrix.variant, 'notorch')
        run: pip uninstall -y torch || true
      - name: DIAG versions
        run: pip freeze | grep -iE "pyside|shiboken|torch|numpy|scipy|pyfftw|pyqtgraph|vispy|opencv|mlx" || true
      # Torch tests are a Linux-only concern here, as the header says. The
      # hosted macOS runners are VMs whose Metal stack advertises MPS via
      # torch.backends.mps.is_available() but fails every allocation
      # ("MPS backend out of memory" for a 1 KiB tensor). requirements.txt
      # pulls torch in transitively, so drop it again on macOS and let the
      # torch-gated tests skip exactly as they do on a dev box without it.
      - name: Drop torch on macOS runners (no usable Metal)
        if: runner.os == 'macOS'
        run: pip uninstall -y torch || true
      - name: Headless test suite
        run: |
          export DHM_USER=ci
          sudo apt-get install -y --no-install-recommends gdb
          export PYTHONPATH=src:tests
          TARGET=tests/
          if [ "${{ matrix.variant }}" = "fileonly" ]; then TARGET=tests/test_ui3_viewer_dialogs.py; fi
          gdb -q -batch \
              -ex "handle SIGPIPE nostop noprint pass" \
              -ex "handle SIGUSR1 nostop noprint pass" \
              -ex "run" \
              -ex "echo \n===== GDB: crashing thread =====\n" \
              -ex "bt 40" \
              -ex "echo \n===== GDB: all threads =====\n" \
              -ex "thread apply all bt 15" \
              --args python -m pytest $TARGET -q --tb=short -p no:cacheprovider \
              -m "not needs_gui" 2>&1 | tee gdb_run.log
          if grep -q "GDB: crashing thread" gdb_run.log && grep -q "received signal" gdb_run.log; then
            echo "CRASH CAPTURED"; exit 1
          fi
      - name: Bug regression
        run: |
          python scripts/check_bugs.py --no-color
      - name: Release metadata consistency
        run: |
          python tools/check_release_consistency.py

  bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_bench }}
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt torch
      - name: Run autofocus benchmark
        run: |
          PYTHONPATH=src:tests \
              python scripts/bench_autofocus.py \
                  --backends default,torch \
                  --shapes 256,512,1024
      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: tasks/bench_autofocus.json
